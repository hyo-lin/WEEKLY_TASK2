services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --appendfsync everysec

  be-blue:
    image: ${ECR_URI}/be-running/ecr:${IMAGE_TAG}
    container_name: be-blue
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - redis

  be-green:
    image: ${ECR_URI}/be-running/ecr:${IMAGE_TAG}
    container_name: be-green
    restart: always
    env_file:
      - .env
    ports:
      - "8081:8080"
    depends_on:
      - redis

volumes:
  redis-data: